name: Publish

# Publishing is tag-driven on purpose: a branch may build the distributions, but only a tag may
# upload them. The `pypi` environment requires a manual approval, so a pull request can never reach
# the upload step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        run: |
          package_version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $package_version in pyproject.toml."
            exit 1
          fi

      - name: Install the publishing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build the distributions
        run: python -m build

      - name: Check the distribution metadata
        run: python -m twine check dist/*

      - name: Upload to PyPI
        # No API token is stored anywhere: twine finds the ambient OIDC token of this run, exchanges
        # it for a short-lived PyPI token scoped to this repository, workflow and environment, and
        # uploads with it. There is nothing to switch on, so there is no flag to pass either.
        # `--non-interactive` keeps a failed exchange from turning into a credential prompt.
        run: python -m twine upload --non-interactive dist/*