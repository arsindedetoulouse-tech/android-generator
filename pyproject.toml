[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "android-skeleton"
version = "0.3.0"
description = "Generate modular Android application projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "arsindedetoulouse-tech" }]
keywords = ["android", "kotlin", "scaffold", "generator", "gradle", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
android-skeleton = "android_skeleton.cli:main"

# The version preflight reads this from the installed metadata instead of hardcoding a URL in code,
# so renaming the repository cannot leave a stale address behind in the checker.
[project.urls]
Repository = "https://github.com/arsindedetoulouse-tech/android-generator"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `templates/**/*` alone silently drops the template's own `.gitignore`, because a glob does not match
# a leading dot. Every generated project ships that file, so it must be named explicitly.
android_skeleton = ["templates/**/*", "templates/**/.*"]
